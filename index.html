<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英语复习</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英语复习">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f3ed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f6f3ed;
  --card: #fffdfa;
  --ink: #262421;
  --muted: #77716a;
  --faint: #aaa39a;
  --line: rgba(63, 55, 47, 0.12);
  --accent: #ef642f;
  --accent-soft: #fff0e8;
  --on-accent: #ffffff;
  --again: #b4472c;
  --good: #3d7a52;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1b19;
    --card: #262422;
    --ink: #f1ede6;
    --muted: #a8a196;
    --faint: #6f6a62;
    --line: rgba(241, 237, 230, 0.12);
    --accent: #f27a4b;
    --accent-soft: #3a2a22;
    --on-accent: #1c1b19;
    --again: #e07a5f;
    --good: #7fbf94;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
}
header h1 { margin: 0; font-size: 20px; font-weight: 600; }
#count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 8px 16px 0;
}
.card {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 24px 20px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--card);
}
.source { margin: 0; color: var(--faint); font-size: 13px; }
.prompt { margin: 0; font-size: 26px; line-height: 1.5; font-weight: 500; }
.hint { margin: 0; color: var(--muted); font-size: 14px; }
.answer { display: flex; flex-direction: column; gap: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
.answer[hidden] { display: none; }
.en-row { display: flex; align-items: flex-start; gap: 10px; }
.en {
  flex: 1;
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 24px;
  line-height: 1.45;
}
.speak {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
}
.speak svg { width: 22px; height: 22px; }
.note { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
.actions {
  position: sticky;
  bottom: 0;
  display: grid;
  gap: 10px;
  padding: 14px 0 calc(14px + env(safe-area-inset-bottom));
  background: var(--bg);
}
.actions.rate { grid-template-columns: repeat(3, 1fr); }
.actions button {
  min-height: 56px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 17px;
  cursor: pointer;
}
.actions button small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
.actions .reveal { border-color: var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; }
.actions .again { color: var(--again); }
.actions .good { color: var(--good); font-weight: 600; }
.message { margin: auto 0; padding: 40px 8px; text-align: center; }
.message h2 { margin: 0 0 10px; font-size: 22px; font-weight: 600; }
.message p { margin: 6px 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
footer { padding: 4px 16px calc(10px + env(safe-area-inset-bottom)); color: var(--faint); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>英语复习</h1>
  <span id="count"></span>
</header>
<main id="app"><div class="message"><p>正在加载卡片…</p></div></main>
<footer>复习进度保存在这台设备的浏览器里</footer>
<script>
"use strict";
const STORE_KEY = "english-review-progress-v1";
const DAY = 86400000;
const GOOD_STEPS = [1, 3, 7, 14, 30, 60];
const app = document.getElementById("app");
const countEl = document.getElementById("count");
let cards = [];
let progress = loadProgress();
let queue = [];
let revealed = false;

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
}
function saveProgress() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch { /* storage unavailable: keep this session in memory */ }
}
function dayStart(offsetDays = 0) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + offsetDays);
  return d.getTime();
}
function isDue(card) {
  const p = progress[card.id];
  return !p || p.due <= Date.now();
}
function stepFor(successes) { return GOOD_STEPS[Math.min(successes, GOOD_STEPS.length - 1)]; }
function dayLabel(days) { return days === 1 ? "明天" : `${days} 天后`; }

function buildQueue() {
  queue = cards.filter(isDue).sort((a, b) => (progress[a.id]?.due ?? 0) - (progress[b.id]?.due ?? 0));
}

function rate(kind) {
  const card = queue[0];
  if (!card) return;
  const p = progress[card.id] || { successes: 0, lapses: 0, due: 0 };
  if (kind === "good") {
    p.due = dayStart(stepFor(p.successes));
    p.successes += 1;
  } else if (kind === "hard") {
    p.due = dayStart(1);
  } else {
    p.successes = 0;
    p.lapses += 1;
    p.due = Date.now();
  }
  p.last = Date.now();
  progress[card.id] = p;
  saveProgress();
  queue.shift();
  if (kind === "again") queue.push(card);
  revealed = false;
  render();
}

function reveal() {
  if (!queue[0] || revealed) return;
  revealed = true;
  render();
  speak(queue[0].en);
}

let voice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const voices = speechSynthesis.getVoices();
  const english = voices.filter(v => /^en(-|_)US/i.test(v.lang));
  voice = english.find(v => /Samantha|Ava|Allison|Alex/.test(v.name)) || english[0]
    || voices.find(v => /^en/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.addEventListener("voiceschanged", pickVoice);
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = 0.9;
  if (voice) utterance.voice = voice;
  speechSynthesis.speak(utterance);
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "text") node.textContent = value;
    else if (key === "onclick") node.addEventListener("click", value);
    else node.setAttribute(key, value);
  }
  for (const child of [].concat(children)) if (child) node.append(child);
  return node;
}
const speakerIcon = () => {
  const wrap = document.createElement("span");
  wrap.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
  return wrap.firstChild;
};

function render() {
  const total = cards.length;
  const left = new Set(queue.map(c => c.id)).size;
  countEl.textContent = total ? `今天还剩 ${left} · 共 ${total}` : "";
  app.replaceChildren();
  const card = queue[0];
  if (!card) { app.append(doneView()); return; }

  const answer = el("div", { class: "answer" }, [
    el("div", { class: "en-row" }, [
      el("p", { class: "en", lang: "en", text: card.en }),
      el("button", { class: "speak", type: "button", "aria-label": "朗读", onclick: () => speak(card.en) }, speakerIcon()),
    ]),
    card.note ? el("p", { class: "note", text: card.note }) : null,
  ]);
  answer.hidden = !revealed;
  app.append(el("article", { class: "card" }, [
    card.source ? el("p", { class: "source", text: card.source }) : null,
    el("p", { class: "prompt", text: card.zh }),
    revealed ? null : el("p", { class: "hint", text: "先用英语说出来，再看答案" }),
    answer,
  ]));

  if (!revealed) {
    app.append(el("div", { class: "actions" }, el("button", { class: "reveal", type: "button", onclick: reveal, text: "显示答案" })));
    return;
  }
  const p = progress[card.id] || { successes: 0 };
  const choice = (cls, label, sub, kind) => el("button", { class: cls, type: "button", onclick: () => rate(kind) }, [label, el("small", { text: sub })]);
  app.append(el("div", { class: "actions rate" }, [
    choice("again", "忘了", "今天再来", "again"),
    choice("hard", "模糊", "明天", "hard"),
    choice("good", "记得", dayLabel(stepFor(p.successes)), "good"),
  ]));
}

function doneView() {
  if (!cards.length) {
    return el("div", { class: "message" }, [el("h2", { text: "还没有卡片" }), el("p", { text: "上完课挑好说法，就会出现在这里。" })]);
  }
  const upcoming = cards.map(c => progress[c.id]?.due).filter(Boolean).sort((a, b) => a - b);
  const tomorrowEnd = dayStart(2);
  const tomorrow = upcoming.filter(due => due < tomorrowEnd).length;
  const next = upcoming[0];
  const nextText = tomorrow ? `明天有 ${tomorrow} 张要复习。`
    : next ? `下一次复习：${new Date(next).toLocaleDateString("zh-CN", { month: "long", day: "numeric" })}。` : "";
  return el("div", { class: "message" }, [el("h2", { text: "今天的复习完成了" }), nextText ? el("p", { text: nextText }) : null]);
}

document.addEventListener("keydown", event => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (!revealed && (event.key === " " || event.key === "Enter")) { event.preventDefault(); reveal(); }
  else if (revealed && event.key === "1") rate("again");
  else if (revealed && event.key === "2") rate("hard");
  else if (revealed && event.key === "3") rate("good");
});
document.addEventListener("visibilitychange", () => {
  // Coming back on a later day must show the cards that became due meanwhile.
  if (document.visibilityState === "visible" && cards.length && !revealed) { buildQueue(); render(); }
});

fetch("cards.json", { cache: "no-store" })
  .then(response => { if (!response.ok) throw new Error(String(response.status)); return response.json(); })
  .then(list => { cards = Array.isArray(list) ? list.filter(c => c && c.id && c.zh && c.en) : []; buildQueue(); render(); })
  .catch(() => {
    app.replaceChildren(el("div", { class: "message" }, [el("h2", { text: "卡片没加载出来" }), el("p", { text: "检查一下网络，然后刷新页面。" })]));
  });
</script>
</body>
</html>
